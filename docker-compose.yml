services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # This stack is the local demo, and no email is ever sent, so the dev-profile outbox
      # is the only way to see a resume link. Without it the headline feature of A18 cannot
      # be demonstrated at all. Do NOT set this profile in a deployed environment: the
      # outbox endpoint has no authentication in front of it and its payloads are bearer
      # credentials.
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onboarding
      SPRING_DATASOURCE_USERNAME: onboarding
      SPRING_DATASOURCE_PASSWORD: onboarding
    ports:
      - "8080:8080"

volumes:
  postgres-data:
