# Flow definition for Poland. See DE.yml for what varies and why.
country: PL
schemaVersion: 1

sections:
  - id: personalDetails
    step: PERSONAL_DETAILS
    title: Personal details
    fields:
      - name: firstName
        label: "First name"
        type: TEXT
        required: true
        maxLength: 100
      - name: lastName
        label: "Last name"
        type: TEXT
        required: true
        maxLength: 100
      - name: dateOfBirth
        label: "Date of birth"
        type: DATE
        required: true
        validators: [adult]
      - name: nationality
        label: "Nationality"
        type: TEXT
        required: true
        maxLength: 2
        pattern: "^[A-Z]{2}$"
        # EU, EEA, Switzerland and the UK. Illustrative and deliberately configuration:
        # in production this list comes from reference data, and either way widening it is
        # a YAML change, never a frontend one.
        options:
          - { value: AT, label: Austria }
          - { value: BE, label: Belgium }
          - { value: BG, label: Bulgaria }
          - { value: CH, label: Switzerland }
          - { value: CY, label: Cyprus }
          - { value: CZ, label: Czechia }
          - { value: DE, label: Germany }
          - { value: DK, label: Denmark }
          - { value: EE, label: Estonia }
          - { value: ES, label: Spain }
          - { value: FI, label: Finland }
          - { value: FR, label: France }
          - { value: GB, label: United Kingdom }
          - { value: GR, label: Greece }
          - { value: HR, label: Croatia }
          - { value: HU, label: Hungary }
          - { value: IE, label: Ireland }
          - { value: IS, label: Iceland }
          - { value: IT, label: Italy }
          - { value: LI, label: Liechtenstein }
          - { value: LT, label: Lithuania }
          - { value: LU, label: Luxembourg }
          - { value: LV, label: Latvia }
          - { value: MT, label: Malta }
          - { value: NL, label: Netherlands }
          - { value: NO, label: Norway }
          - { value: PL, label: Poland }
          - { value: PT, label: Portugal }
          - { value: RO, label: Romania }
          - { value: SE, label: Sweden }
          - { value: SI, label: Slovenia }
          - { value: SK, label: Slovakia }

  - id: address
    step: ADDRESS
    title: Business address
    fields:
      - name: street
        label: "Street"
        type: TEXT
        required: true
        maxLength: 200
      - name: houseNumber
        label: "House number"
        type: TEXT
        required: true
        maxLength: 20
      - name: postalCode
        label: "Postal code (kod pocztowy)"
        type: TEXT
        required: true
        pattern: "^\\d{2}-\\d{3}$"
      - name: city
        label: "City"
        type: TEXT
        required: true
        maxLength: 100

  - id: taxInformation
    step: TAX_INFORMATION
    title: Tax information
    fields:
      - name: nip
        label: "NIP"
        type: TEXT
        required: true
        maxLength: 10
        validators: [nip]
      - name: vatRegistered
        label: "Registered for VAT"
        type: BOOLEAN
        required: true
      - name: vatEu
        label: "EU VAT number (VAT UE)"
        type: TEXT
        required: true
        maxLength: 20
        requiredWhen:
          field: vatRegistered
          equals: "true"

  - id: businessRegistry
    step: BUSINESS_REGISTRY
    title: Business registry
    # CEIDG registration is how a Polish sole proprietorship exists, so unlike DE there is
    # no "are you registered" gate: the identifiers are unconditional.
    fields:
      - name: regon
        label: "REGON"
        type: TEXT
        required: true
        maxLength: 14
        validators: [regon]
      - name: ceidgRegistrationDate
        label: "CEIDG registration date"
        type: DATE
        required: true
      - name: pkdCode
        label: "PKD code"
        type: TEXT
        required: true
        maxLength: 7

  - id: paymentDetails
    step: PAYMENT_DETAILS
    title: Payout details
    fields:
      - name: accountHolder
        label: "Account holder"
        type: TEXT
        required: true
        maxLength: 200
      - name: iban
        label: "IBAN"
        type: TEXT
        required: true
        maxLength: 34
        validators: [iban]

  - id: consent
    step: CONSENT
    title: Consents
    # The item set is identical in all three countries: the same five, all required.
    # The only per-country difference is the creditCheck version, because the bureau
    # named in that consent text differs per market. The engine supports a genuinely
    # different item set -- see FlowVariationCapabilityTest -- but these markets do not
    # have one, and inventing a difference here to demonstrate the capability would put
    # fiction into shipped configuration.
    fields:
      - name: informationConfirmed
        label: "I confirm that the information I have given is accurate and complete"
        type: CONSENT
        required: true
        version: "2026-01"
      - name: termsOfService
        label: "I accept the Terms of Service"
        type: CONSENT
        required: true
        version: "2026-01"
      - name: dataProcessing
        label: "I consent to my personal data being processed for this application"
        type: CONSENT
        required: true
        version: "2026-01"
      - name: privacyNotice
        label: "I have read the Privacy Notice"
        type: CONSENT
        required: true
        version: "2026-01"
      # BIK in Poland.
      - name: creditCheck
        label: "I consent to a credit check with BIK"
        type: CONSENT
        required: true
        version: "pl-bik-2026-01"
