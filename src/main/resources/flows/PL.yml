# Flow definition for Poland. See DE.yml for what varies and why.
country: PL
schemaVersion: 1

sections:
  - id: personalDetails
    step: PERSONAL_DETAILS
    title: Personal details
    fields:
      - name: firstName
        type: TEXT
        required: true
        maxLength: 100
      - name: lastName
        type: TEXT
        required: true
        maxLength: 100
      - name: dateOfBirth
        type: DATE
        required: true
        validators: [adult]
      - name: nationality
        type: TEXT
        required: true
        maxLength: 2
        pattern: "^[A-Z]{2}$"

  - id: address
    step: ADDRESS
    title: Business address
    fields:
      - name: street
        type: TEXT
        required: true
        maxLength: 200
      - name: houseNumber
        type: TEXT
        required: true
        maxLength: 20
      - name: postalCode
        type: TEXT
        required: true
        pattern: "^\\d{2}-\\d{3}$"
      - name: city
        type: TEXT
        required: true
        maxLength: 100

  - id: taxInformation
    step: TAX_INFORMATION
    title: Tax information
    fields:
      - name: nip
        type: TEXT
        required: true
        maxLength: 10
        validators: [nip]
      - name: vatRegistered
        type: BOOLEAN
        required: true
      - name: vatEu
        type: TEXT
        required: true
        maxLength: 20
        requiredWhen:
          field: vatRegistered
          equals: "true"

  - id: businessRegistry
    step: BUSINESS_REGISTRY
    title: Business registry
    # CEIDG registration is how a Polish sole proprietorship exists, so unlike DE there is
    # no "are you registered" gate: the identifiers are unconditional.
    fields:
      - name: regon
        type: TEXT
        required: true
        maxLength: 14
        validators: [regon]
      - name: ceidgRegistrationDate
        type: DATE
        required: true
      - name: pkdCode
        type: TEXT
        required: true
        maxLength: 7

  - id: paymentDetails
    step: PAYMENT_DETAILS
    title: Payout details
    fields:
      - name: accountHolder
        type: TEXT
        required: true
        maxLength: 200
      - name: iban
        type: TEXT
        required: true
        maxLength: 34
        validators: [iban]

  - id: consent
    step: CONSENT
    title: Consents
    # The item set is identical in all three countries: the same five, all required.
    # The only per-country difference is the creditCheck version, because the bureau
    # named in that consent text differs per market. The engine supports a genuinely
    # different item set -- see FlowVariationCapabilityTest -- but these markets do not
    # have one, and inventing a difference here to demonstrate the capability would put
    # fiction into shipped configuration.
    fields:
      - name: informationConfirmed
        type: CONSENT
        required: true
        version: "2026-01"
      - name: termsOfService
        type: CONSENT
        required: true
        version: "2026-01"
      - name: dataProcessing
        type: CONSENT
        required: true
        version: "2026-01"
      - name: privacyNotice
        type: CONSENT
        required: true
        version: "2026-01"
      # BIK in Poland.
      - name: creditCheck
        type: CONSENT
        required: true
        version: "pl-bik-2026-01"
