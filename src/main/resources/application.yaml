spring:
  application:
    name: zalando-onboarding-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${SPRING_DATASOURCE_USERNAME:onboarding}
    password: ${SPRING_DATASOURCE_PASSWORD:onboarding}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    resources:
      cache:
        cachecontrol:
          # index.html, app.js and styles.css ship under fixed names, so there is no hash in
          # the filename to invalidate them. no-cache means "keep it, but always revalidate":
          # one conditional request per load, and nobody is ever stuck on a stale app.js
          # after a deploy. Without it the browser caches heuristically and does not notice.
          no-cache: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are rendered as RFC 7807 problem+json by the api.error package,
    # never by the servlet container's default page.
    whitelabel:
      enabled: false

onboarding:
  # Where a resume link points. Configured, not derived from the inbound request: the link
  # is a bearer credential issued for a browser that is not the one making the call, so a
  # spoofed Host header must not be able to aim it somewhere else.
  resume-base-url: ${ONBOARDING_RESUME_BASE_URL:http://localhost:8080/#/resume}

  decision:
    # Demo fixture data standing in for a credit bureau. There is no real debt register and
    # no bureau integration -- see the scope boundaries in CLAUDE.md. Quoted so YAML keeps
    # them as strings rather than parsing them into numbers and dropping leading zeros.
    debt-register-tax-ids:
      - "99999999999"
      - "7777777777"
    # At or above this identity confidence an application is approved; below it, referred.
    refer-below-confidence: 70

logging:
  level:
    com.zalando.onboarding: DEBUG
  pattern:
    # Every line carries the requestId the response header echoed, which is how a support
    # request is traced without ever logging an email, an IBAN or a token (A13).
    level: "%5p [%X{requestId:-no-request}]"
