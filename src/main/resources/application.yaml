spring:
  application:
    name: zalando-onboarding-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${SPRING_DATASOURCE_USERNAME:onboarding}
    password: ${SPRING_DATASOURCE_PASSWORD:onboarding}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are rendered as RFC 7807 problem+json by the api.error package,
    # never by the servlet container's default page.
    whitelabel:
      enabled: false

onboarding:
  # Where a resume link points. Configured, not derived from the inbound request: the link
  # is a bearer credential issued for a browser that is not the one making the call, so a
  # spoofed Host header must not be able to aim it somewhere else.
  resume-base-url: ${ONBOARDING_RESUME_BASE_URL:http://localhost:8080/resume}

logging:
  level:
    com.zalando.onboarding: DEBUG
  pattern:
    # Every line carries the requestId the response header echoed, which is how a support
    # request is traced without ever logging an email, an IBAN or a token (A13).
    level: "%5p [%X{requestId:-no-request}]"
